[workspace]
members = [
  "crates/contracts",
  "crates/controller",
  "crates/worker",
  "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "tokio"] }
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
bytes = "1.9"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hex = "0.4"
http = "1.2"
http-body-util = "0.1"
hyper = { version = "1.5", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyperlocal = "0.9"
nix = { version = "0.31", features = ["user", "fs"] }
rand = "0.9"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "chrono", "uuid"] }
thiserror = "2.0"
tokio = { version = "1.43", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tar = "0.4"
tempfile = "3.20"
uuid = { version = "1.12", features = ["serde", "v4"] }
url = "2.5"
walkdir = "2.5"
webtop-contracts = { path = "crates/contracts" }
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
