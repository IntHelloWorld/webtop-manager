name: Feature request
description: Propose a scoped product improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest complete user flow.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and lifecycle impact
      description: Note any Docker, filesystem, network exposure, secret, deletion, or recovery implications.
    validations:
      required: true
