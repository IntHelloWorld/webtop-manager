name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: 1.88.0
          targets: x86_64-unknown-linux-gnu
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.4.1
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev \
            jq librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev openssl patchelf sqlite3 zstd
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release metadata
        run: ./scripts/check-release-version.sh "${GITHUB_REF:-}"
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Test Rust workspace
        run: cargo test --workspace --exclude webtop-manager
      - name: Check Tauri crate
        run: cargo check --package webtop-manager --locked
      - name: Test frontend
        run: pnpm test
      - name: Build frontend
        run: pnpm build
      - name: Build bundled controller image
        run: ./scripts/package-controller.sh
      - name: Verify bundled controller archive
        run: zstd --test --quiet src-tauri/assets/controller-image.tar.zst
      - name: Probe bundled controller image
        run: ./scripts/test-packaged-controller.sh
      - name: Run Docker-backed release acceptance
        run: ./scripts/test-docker-acceptance.sh
      - name: Build Linux packages
        run: pnpm tauri build --bundles deb,appimage
      - name: Stage release assets and checksums
        run: |
          mkdir release-assets
          version=$(node -p "require('./package.json').version")
          cp target/release/bundle/deb/*.deb \
            "release-assets/webtop-manager_${version}_amd64.deb"
          cp target/release/bundle/appimage/*.AppImage \
            "release-assets/webtop-manager_${version}_amd64.AppImage"
          cd release-assets
          sha256sum ./*.deb ./*.AppImage | sort -k2 > SHA256SUMS
      - name: Upload Linux packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webtop-manager-linux-x86_64
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  publish-github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: webtop-manager-linux-x86_64
          path: release-assets
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: false
          make_latest: true
